<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<title>Vaachan · Admin Overview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/shared.css">
<style>
  .heatmap-legend {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 4px;
    margin-bottom: 14px;
    font-size: 0.76rem;
    font-weight: 600;
  }
</style>
</head>
<body>

<div id="nav-container"></div>

<div class="container" style="padding-top:4px;">

  <!-- Stat Cards -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-icon indigo"><span class="solid-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3 2.5 8 12 13l7.75-4.08V15H21V8L12 3Zm-6 8.16V16c0 1.66 2.69 3 6 3s6-1.34 6-3v-4.84L12 14.32 6 11.16Z"/></svg></span></div>
      <div>
        <div class="stat-val" id="stat-teachers">—</div>
        <div class="stat-label">Total Teachers</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon marigold"><span class="solid-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 4h12a2 2 0 0 1 2 2v12.5a1.5 1.5 0 0 1-1.5 1.5H5.5A1.5 1.5 0 0 1 4 18.5V6a2 2 0 0 1 2-2Zm1 4v9h10V8H7Zm2-4v2h6V4H9Z"/></svg></span></div>
      <div>
        <div class="stat-val" id="stat-students">—</div>
        <div class="stat-label">Registered Students</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon mint"><span class="solid-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10.01 10.01 0 0 0 12 2Zm-1.4 14.2-4-4 1.4-1.4 2.6 2.59 5.6-5.59 1.4 1.4-7 7Z"/></svg></span></div>
      <div>
        <div class="stat-val" id="stat-sessions">—</div>
        <div class="stat-label">Evaluations Done</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon sky"><span class="solid-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 20h16v2H2V4h2v16Zm3-2V9h3v9H7Zm5 0V5h3v13h-3Zm5 0v-6h3v6h-3Z"/></svg></span></div>
      <div>
        <div class="stat-val" id="stat-avg-score">—</div>
        <div class="stat-label">School Avg Score</div>
      </div>
    </div>
  </div>

  <div class="grid-2col">
    <!-- Heatmap -->
    <div class="card">
      <h2 class="section-title">Section Performance Heatmap</h2>
      <div class="heatmap-legend">
        <span>Average score:</span>
        <span class="badge badge-coral">Red &lt;5.0</span>
        <span class="badge badge-marigold">Amber 5–7.5</span>
        <span class="badge badge-mint">Green ≥7.5</span>
      </div>
      <div class="heatmap-wrap">
        <table class="heatmap-table" id="heatmap-container">
          <!-- Built by JS -->
        </table>
      </div>
    </div>

    <!-- Recent evaluations across school -->
    <div class="card">
      <h2 class="section-title">Recent School Evaluations</h2>
      <p class="section-desc">Latest evaluations recorded across all sections.</p>
      <div class="table-wrap">
        <table class="list-table">
          <thead>
            <tr>
              <th>Student</th>
              <th>Class</th>
              <th>Evaluator</th>
              <th>CWPM</th>
              <th>Grade</th>
            </tr>
          </thead>
          <tbody id="recent-sessions-tbody">
            <tr class="empty-row"><td colspan="5">Loading school activities...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/db.js"></script>
<script src="../js/utils.js"></script>

<script>
  window.addEventListener('DOMContentLoaded', async () => {
    await window.auth.checkGuard('admin');
    window.utils.renderNav('dashboard', true);

    loadAdminDashboard();
  });

  async function loadAdminDashboard() {
    try {
      const [teachers, classes, students, sessions] = await Promise.all([
        window.db.getTeachers(),
        window.db.getClasses(),
        window.db.getStudents(),
        window.db.getSessions()
      ]);

      document.getElementById('stat-teachers').textContent = teachers.length;
      document.getElementById('stat-students').textContent = students.length;
      document.getElementById('stat-sessions').textContent = sessions.length;

      if (sessions.length > 0) {
        const sumScore = sessions.reduce((acc, s) => acc + Number(s.overall_score || 0), 0);
        document.getElementById('stat-avg-score').textContent = (sumScore / sessions.length).toFixed(1);
      } else {
        document.getElementById('stat-avg-score').textContent = '—';
      }

      const classSessions = {};
      sessions.forEach(s => {
        const student = s.students || {};
        if (student.class_id) {
          if (!classSessions[student.class_id]) classSessions[student.class_id] = [];
          classSessions[student.class_id].push(s);
        }
      });

      const heatmapContainer = document.getElementById('heatmap-container');
      
      let html = '<thead><tr><th class="row-hd">Class</th>';
      ['A','B','C','D','E'].forEach(sec => {
        html += `<th>Sec ${sec}</th>`;
      });
      html += '</tr></thead><tbody>';

      for (let c = 3; c <= 5; c++) {
        html += `<tr><th class="row-hd">Class ${c}</th>`;
        
        ['A','B','C','D','E'].forEach(sec => {
          const matchedClass = classes.find(cl => cl.class_num === c && cl.section === sec);
          
          let scoreText = '—';
          let cellClass = 'heatmap-none';
          let countText = '0 tests';

          if (matchedClass) {
            const classSess = classSessions[matchedClass.id] || [];
            if (classSess.length > 0) {
              const avg = classSess.reduce((acc, s) => acc + Number(s.overall_score || 0), 0) / classSess.length;
              scoreText = avg.toFixed(1);
              countText = `${classSess.length} test${classSess.length > 1 ? 's' : ''}`;
              
              if (avg >= 7.5) cellClass = 'heatmap-high';
              else if (avg >= 5.0) cellClass = 'heatmap-mid';
              else cellClass = 'heatmap-low';
            }
          }

          html += `<td><div class="heatmap-cell ${cellClass}">${scoreText}<span class="c-count">${countText}</span></div></td>`;
        });
        html += '</tr>';
      }

      html += '</tbody>';
      heatmapContainer.innerHTML = html;

      const tbody = document.getElementById('recent-sessions-tbody');
      const limitSessions = sessions.slice(0, 8);

      if (limitSessions.length === 0) {
        tbody.innerHTML = `<tr class="empty-row"><td colspan="5">No evaluations recorded yet.</td></tr>`;
      } else {
        tbody.innerHTML = limitSessions.map(s => {
          const student = s.students || {};
          const classLabel = student.classes ? `${student.classes.class_num}${student.classes.section}` : '—';
          const teacherName = s.profiles ? s.profiles.name : 'Unknown';
          
          let color = 'badge-indigo';
          if (s.overall_score >= 8) color = 'badge-mint';
          else if (s.overall_score < 4) color = 'badge-coral';

          return `
            <tr>
              <td><b>${window.utils.escapeHtml(student.name || 'Unknown')}</b></td>
              <td>${classLabel}</td>
              <td>${window.utils.escapeHtml(teacherName)}</td>
              <td>${Math.round(s.cwpm || 0)}</td>
              <td><span class="badge ${color}">${s.grade || 'E'}</span></td>
            </tr>
          `;
        }).join('');
      }

    } catch (e) {
      console.error(e);
      window.utils.toast("Error loading admin dashboard: " + e.message, "error");
    }
  }
</script>
</body>
</html>
