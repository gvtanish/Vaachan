name: Build Android APK (Capacitor)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm install

      - name: Prepare web dist directory
        run: |
          mkdir -p www
          rsync -av --exclude='node_modules' --exclude='.git' --exclude='android' --exclude='.github' --exclude='www' ./ www/

      - name: Add Android platform & Capacitor Sync
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Configure Android Permissions in AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" \/>\n    <uses-permission android:name="android.permission.INTERNET" \/>' $MANIFEST
          fi

      - name: Build Android Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Vaachan.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vaachan.apk
          path: android/app/build/outputs/apk/debug/Vaachan.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release with Vaachan.apk
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/Vaachan.apk
          tag_name: latest
          name: "Vaachan Android App (Latest Build)"
          body: "Latest compiled Vaachan Android APK package built by GitHub Actions."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
