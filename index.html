<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<title>Vaachan · School Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/shared.css">
<style>
  body {
    background:
      radial-gradient(circle at 12% 8%, rgba(232,163,61,0.12), transparent 40%),
      radial-gradient(circle at 90% 85%, rgba(62,124,177,0.09), transparent 45%),
      var(--paper);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: max(24px, env(safe-area-inset-top, 24px)) 16px max(24px, env(safe-area-inset-bottom, 24px));
  }

  .wrap { width: 100%; max-width: 430px; margin: 0 auto; }

  .letterhead {
    text-align: center;
    font-size: 0.76rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--indigo-soft);
    margin-bottom: 12px;
  }

  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-bottom: 24px;
    text-align: center;
  }
  .brand h1 {
    font-family: 'Baloo 2', sans-serif;
    font-size: 2.2rem; font-weight: 800; margin: 0;
    color: var(--indigo);
    line-height: 1.1;
  }
  .brand p { margin: 2px 0 0; font-size: 0.88rem; color: var(--ink-soft); font-weight: 500; }

  .login-card {
    position: relative;
    background: var(--paper-panel);
    border: 1px solid var(--line);
    border-radius: var(--radius-xl);
    padding: 32px 28px;
    box-shadow: var(--shadow-lg);
    margin-bottom: 20px;
    transition: var(--transition);
  }

  .tabs {
    display: flex;
    background: var(--paper);
    border: 1.5px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 3px;
    margin-bottom: 22px;
  }
  .tab {
    flex: 1; text-align: center; padding: 10px 8px;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700; font-size: 0.95rem;
    cursor: pointer; color: var(--ink-soft);
    border-radius: 8px;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    user-select: none;
    touch-action: manipulation;
  }
  .tab.active-teacher {
    background: var(--paper-panel);
    color: var(--marigold-deep);
    box-shadow: var(--shadow-xs);
  }
  .tab.active-admin {
    background: var(--indigo);
    color: #fff;
    box-shadow: var(--shadow-xs);
  }

  .btn-teacher {
    background: linear-gradient(140deg, var(--marigold), var(--marigold-deep));
    color: #fff;
    box-shadow: 0 6px 18px -6px rgba(201,121,27,0.6);
    width: 100%; font-size: 1.05rem; padding: 13px; margin-top: 12px;
    border-radius: var(--radius-sm);
  }
  .btn-teacher:hover { transform: translateY(-1px); box-shadow: 0 8px 22px -6px rgba(201,121,27,0.7); }
  
  .btn-admin-login {
    background: linear-gradient(140deg, var(--indigo-soft), var(--indigo));
    color: #fff;
    box-shadow: 0 6px 18px -6px rgba(27,42,74,0.6);
    width: 100%; font-size: 1.05rem; padding: 13px; margin-top: 12px;
    border-radius: var(--radius-sm);
  }

  .pwd-toggle-btn {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    color: var(--ink-soft);
    padding: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
  }

  .footer {
    text-align: center;
    font-size: 0.74rem;
    color: var(--ink-soft);
    opacity: 0.75;
    margin-top: 20px;
    line-height: 1.5;
  }

  @media (max-width: 480px) {
    body { justify-content: flex-start; padding-top: max(20px, env(safe-area-inset-top, 20px)); }
    .letterhead { font-size: 0.68rem; line-height: 1.45; }
    .brand h1 { font-size: 1.85rem; }
    .brand p { font-size: 0.82rem; }
    .login-card { padding: 22px 18px; border-radius: var(--radius-lg); }
    .tabs { margin-bottom: 18px; }
    .tab { padding: 8px 4px; font-size: 0.88rem; }
    .footer { margin-top: 16px; font-size: 0.7rem; }
  }
</style>
</head>
<body>

<div class="wrap">
  <p class="letterhead">PM SHRI Kendriya Vidyalaya AFS Sulur</p>

  <div class="logo-row">
    <img src="./assets/kv_logo.png" alt="KV Logo">
    <img src="./assets/pm_shri_logo.png" alt="PM SHRI Logo">
  </div>

  <div class="brand">
    <div style="width:100%;">
      <h1>Vaachan</h1>
      <p>Reading Fluency Platform</p>
    </div>
  </div>

  <div class="login-card">
    <div class="alert alert-danger" id="login-error" style="display:none; margin-bottom:16px;"></div>

    <div class="tabs">
      <div class="tab active-teacher" id="tab-teacher" onclick="setRole('teacher')">
        <span class="solid-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3 2.5 8 12 13l7.75-4.08V15H21V8L12 3Zm-6 8.16V16c0 1.66 2.69 3 6 3s6-1.34 6-3v-4.84L12 14.32 6 11.16Z"/></svg></span> Teacher
      </div>
      <div class="tab" id="tab-admin" onclick="setRole('admin')">
        <span class="solid-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M17 9h-1V7a4 4 0 0 0-8 0v2H7a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2Zm-5 7a2 2 0 1 1 0-4 2 2 0 0 1 0 4Zm2-7h-4V7a2 2 0 1 1 4 0v2Z"/></svg></span> Admin
      </div>
    </div>

    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="field-group">
        <label id="user-label" for="username">Teacher Employee ID</label>
        <input type="text" id="username" class="text-input" placeholder="e.g. T10042" required autocomplete="username" inputmode="text">
      </div>

      <div class="field-group" style="margin-bottom:20px;">
        <label for="password">Password</label>
        <div style="position:relative;">
          <input type="password" id="password" class="text-input" placeholder="••••••••" required autocomplete="current-password" style="padding-right:44px;">
          <button type="button" class="pwd-toggle-btn" onclick="togglePwd()" title="Show/hide password" aria-label="Show or hide password">
            <span class="solid-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 5C6.5 5 2.73 9.11 1.5 12c1.23 2.89 5 7 10.5 7s9.27-4.11 10.5-7C21.27 9.11 17.5 5 12 5Zm0 11.5a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9Zm0-2A2.5 2.5 0 1 0 12 9a2.5 2.5 0 0 0 0 5.5Z"/></svg></span>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-teacher" id="submit-btn">Enter Teacher Portal</button>
    </form>
  </div>

  <p class="footer">PM SHRI Kendriya Vidyalaya AFS Sulur &middot; Built by Nexora Technologies &middot; Vaachan v2.0</p>
</div>

<!-- Load Supabase Library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./js/supabase.js"></script>
<script src="./js/auth.js"></script>
<script src="./js/utils.js"></script>

<script>
  let currentRole = 'teacher';

  window.addEventListener('DOMContentLoaded', () => {
    // Auto routing if already logged in
    window.auth.getSession().then(session => {
      if (session) {
        const role = sessionStorage.getItem('VAACHAN_USER_ROLE');
        if (role === 'admin') {
          window.location.href = './admin/dashboard.html';
        } else if (role === 'teacher') {
          window.location.href = './teacher/dashboard.html';
        }
      }
    });
  });

  function togglePwd() {
    const p = document.getElementById('password');
    p.type = p.type === 'password' ? 'text' : 'password';
  }

  function setRole(role) {
    currentRole = role;
    const tabTeacher = document.getElementById('tab-teacher');
    const tabAdmin = document.getElementById('tab-admin');
    const userLabel = document.getElementById('user-label');
    const usernameInput = document.getElementById('username');
    const submitBtn = document.getElementById('submit-btn');

    if (role === 'teacher') {
      tabTeacher.className = 'tab active-teacher';
      tabAdmin.className = 'tab';
      userLabel.textContent = 'Teacher Employee ID';
      usernameInput.placeholder = 'e.g. T10042';
      submitBtn.className = 'btn btn-teacher';
      submitBtn.textContent = 'Enter Teacher Portal';
    } else {
      tabTeacher.className = 'tab';
      tabAdmin.className = 'tab active-admin';
      userLabel.textContent = 'Admin Email';
      usernameInput.placeholder = 'admin@vaachan.school';
      submitBtn.className = 'btn btn-admin-login';
      submitBtn.textContent = 'Enter Admin Portal';
    }
  }

  async function handleLogin(e) {
    e.preventDefault();
    const errEl = document.getElementById('login-error');
    errEl.style.display = 'none';

    const username = document.getElementById('username').value.trim();
    const pass = document.getElementById('password').value;

    const submitBtn = document.getElementById('submit-btn');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Authenticating...';

    try {
      const profile = await window.auth.signIn(username, pass);
      
      // Verification of role matching
      if (profile.role !== currentRole) {
        throw new Error(`Account role is not matched. The entered account is registered as a ${profile.role}.`);
      }

      if (profile.role === 'admin') {
        window.location.href = './admin/dashboard.html';
      } else {
        window.location.href = './teacher/dashboard.html';
      }
    } catch (err) {
      errEl.textContent = err.message || "Invalid username or password.";
      errEl.style.display = 'flex';
      submitBtn.disabled = false;
      submitBtn.textContent = currentRole === 'teacher' ? 'Enter Teacher Portal' : 'Enter Admin Portal';
    }
  }
</script>
</body>
</html>
